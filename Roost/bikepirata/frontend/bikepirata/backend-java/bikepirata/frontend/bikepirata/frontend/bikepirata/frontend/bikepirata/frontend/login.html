<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Roost</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="logo">
                <i class="fas fa-bicycle"></i>
                <span>ROOST</span>
            </a>
            <p class="auth-subtitle">Entre na sua conta</p>
        </div>
        
        <div class="auth-card">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <p>Entre para gerenciar seus anúncios</p>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email" class="required">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="login-senha" class="required">Senha</label>
                    <input type="password" id="login-senha" required placeholder="Sua senha">
                    <div class="input-hint">
                        <a href="#" class="esqueci-senha">Esqueci minha senha</a>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </div>
                
                <div class="auth-links">
                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se gratuitamente</a></p>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            <p><a href="index.html"><i class="fas fa-arrow-left"></i> Voltar para o site</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
